<script>
// ============================================================

let currentDefcon = 5;
let missiles = [];

let threatLevels = {};

// Canvas refs
const canvasMain = document.getElementById('canvas-main');
const canvasLeft = document.getElementById('canvas-left');
const canvasRight = document.getElementById('canvas-right');
const ctxMain = canvasMain.getContext('2d');
const ctxLeft = canvasLeft.getContext('2d');
const ctxRight = canvasRight.getContext('2d');

// ============================================================
// MAP DATA - Simplified Northern Hemisphere wireframe
// ============================================================

// Major cities/targets with rough map positions [x%, y%]

// Soviet launch sites
const sovietBases = [

const usBases = [
  { x: 0.15, y: 0.36 }, { x: 0.17, y: 0.34 }, { x: 0.20, y: 0.38 },
  { x: 0.14, y: 0.40 }, { x: 0.22, y: 0.36 }, { x: 0.12, y: 0.38 },
  { x: 0.18, y: 0.32 }, { x: 0.16, y: 0.38 },
];

// ============================================================
// MISSILE CLASS
// ============================================================

class Missile {
  constructor(from, to, color, speed) {
    this.fromX = from.x;
    this.fromY = from.y;
    this.toX = to.x;
    this.toY = to.y;
    this.targetName = to.name || "UNKNOWN";
    this.color = color;
    this.progress = 0;
    this.speed = speed || (0.002 + Math.random() * 0.004);
    this.done = false;
    this.impacted = false;
    this.arcHeight = 0.08 + Math.random() * 0.12;
    this.trail = [];
  }

  update() {
    if (this.done) return;
    this.progress += this.speed;
    if (this.progress >= 1) {
      this.progress = 1;
      this.done = true;
      if (!this.impacted) {
        this.impacted = true;
        totalImpacts++;
        impacts.push({
          x: this.toX, y: this.toY,
          time: Date.now(), radius: 0, name: this.targetName,
          color: this.color
        });
      }
    }
    // Store trail points
    const pos = this.getPosition(this.progress);
    this.trail.push(pos);
    if (this.trail.length > 60) this.trail.shift();
  }

  getPosition(t) {
    const x = this.fromX + (this.toX - this.fromX) * t;
    const arc = Math.sin(t * Math.PI) * this.arcHeight;
    const y = this.fromY + (this.toY - this.fromY) * t - arc;
    return { x, y };
  }

  draw(ctx, w, h) {
    // Draw the full trajectory arc as a thin line
    ctx.beginPath();
    ctx.strokeStyle = this.color + '40';
    ctx.lineWidth = 0.5;
    for (let t = 0; t <= Math.min(this.progress, 1); t += 0.02) {
      const pos = this.getPosition(t);
      if (t === 0) ctx.moveTo(pos.x * w, pos.y * h);
      else ctx.lineTo(pos.x * w, pos.y * h);
    }
    ctx.stroke();

    // Draw brighter trail near the head
    if (!this.done) {
      const trailLen = Math.min(this.trail.length, 15);
      for (let i = this.trail.length - trailLen; i < this.trail.length; i++) {
        const alpha = (i - (this.trail.length - trailLen)) / trailLen;
        ctx.beginPath();
        ctx.fillStyle = this.color + Math.floor(alpha * 200).toString(16).padStart(2, '0');
        ctx.arc(this.trail[i].x * w, this.trail[i].y * h, 1 + alpha * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw missile head
      const head = this.getPosition(this.progress);
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 6;
      ctx.arc(head.x * w, head.y * h, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

// ============================================================
// DEFCON CONFIGURATION
// ============================================================

const defconConfig = {
  5: { missileRate: 0, label: "PEACE", color: "#3366ff", bgFlicker: false },
  4: { missileRate: 0, label: "INCREASED READINESS", color: "#33cc33", bgFlicker: false },
  3: { missileRate: 2000, label: "ROUND HOUSE", color: "#cccc00", bgFlicker: false },
  2: { missileRate: 600, label: "FAST PACE", color: "#ff8800", bgFlicker: false },
  1: { missileRate: 120, label: "COCKED PISTOL", color: "#ff2222", bgFlicker: true },
};

// ============================================================
// DEFCON CONTROL
// ============================================================

function setDefcon(level) {
  currentDefcon = level;

  // Update buttons
  document.querySelectorAll('.defcon-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.defcon-${level}`).classList.add('active');

  // Update display
  const cfg = defconConfig[level];
  const dd = document.getElementById('defcon-display');
  dd.textContent = `DEFCON ${level}`;
  dd.style.color = cfg.color;
  dd.style.textShadow = `0 0 10px ${cfg.color}`;

  if (level <= 3) {
    warStartTime = Date.now();
    addEvent(`DEFCON ${level} — ${cfg.label}`);
  }

  if (level === 3) {
    addEvent("EARLY WARNING SATELLITES ACTIVE");
    addEvent("MONITORING ICBM FIELDS");
  } else if (level === 2) {
    addEvent("MULTIPLE LAUNCH DETECTIONS");
    addEvent("STRATEGIC AIR COMMAND ALERTED");
    addEvent("BOMBER WINGS SCRAMBLED");
  } else if (level === 1) {
    addEvent("MASSIVE FIRST STRIKE DETECTED");
    addEvent("RETALIATORY LAUNCH AUTHORIZED");
    addEvent("ALL ASSETS WEAPONS FREE");
  }

  if (level >= 4) {
    missiles = [];
    impacts = [];
    totalMissiles = 0;
    totalImpacts = 0;
    strikeData = [];
    eventMessages = [];
    if (level === 5) addEvent("SYSTEM READY — NO THREATS DETECTED");
    if (level === 4) addEvent("ELEVATED ALERT — MONITORING");
  }
}

// ============================================================
// EVENT LOG
// ============================================================

function addEvent(msg) {
  eventMessages.unshift({ text: msg, time: Date.now() });
  if (eventMessages.length > 8) eventMessages.pop();
}

function renderEventLog() {
  const el = document.getElementById('event-log');
  el.innerHTML = eventMessages.map((e, i) => {
    const age = Date.now() - e.time;
    const opacity = Math.max(0.3, 1 - age / 15000);
    return `<div style="opacity:${opacity}">${e.text}</div>`;
  }).join('');
}

// ============================================================
// LAUNCH MISSILES
// ============================================================

function launchMissile() {
  const cfg = defconConfig[currentDefcon];
  if (cfg.missileRate === 0) return;

  const now = Date.now();
  if (now - lastMissileTime < cfg.missileRate) return;
  lastMissileTime = now;

  // Determine launch count based on defcon
  const count = currentDefcon === 1 ? Math.floor(2 + Math.random() * 5) :
                currentDefcon === 2 ? Math.floor(1 + Math.random() * 3) : 1;

  for (let i = 0; i < count; i++) {
    const side = Math.random() < 0.5 ? 'soviet' : 'us';
    let from, to, color;

    if (side === 'soviet') {
      from = sovietBases[Math.floor(Math.random() * sovietBases.length)];
      const allTargets = [...usTargets, ...euroTargets];
      to = allTargets[Math.floor(Math.random() * allTargets.length)];
      color = '#ff3333';
    } else {
      from = usBases[Math.floor(Math.random() * usBases.length)];
      to = sovietTargets[Math.floor(Math.random() * sovietTargets.length)];
      color = '#33ff33';
    }

    const m = new Missile(from, to, color, 0.003 + Math.random() * 0.005);
    missiles.push(m);
    totalMissiles++;

    // Occasional event message
    if (Math.random() < 0.15) {
      const verb = side === 'soviet' ? 'INBOUND' : 'OUTBOUND';
      addEvent(`${verb} ICBM — TGT: ${to.name}`);
    }
  }

  // Track strike data for graphs
  strikeData.push({ time: now, total: totalMissiles, impacts: totalImpacts });
  if (strikeData.length > 200) strikeData.shift();
}

// ============================================================
// DRAW MAIN MAP
// ============================================================

function drawMap(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  // Background flicker at DEFCON 1
  if (currentDefcon === 1 && Math.random() < 0.03) {
    ctx.fillStyle = 'rgba(255,0,0,0.02)';
    ctx.fillRect(0, 0, w, h);
  }

  // Draw grid lines
  ctx.strokeStyle = '#0a1a0a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 20; i++) {
    ctx.beginPath();
    ctx.moveTo(i * w / 20, 0);
    ctx.lineTo(i * w / 20, h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * h / 20);
    ctx.lineTo(w, i * h / 20);
    ctx.stroke();
  }

  // Draw continents
  const mapColor = defconConfig[currentDefcon].color;
  ctx.strokeStyle = mapColor + '50';
  ctx.lineWidth = 1.2;
  Object.values(continentPaths).forEach(path => {
    ctx.beginPath();
    path.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p[0] * w, p[1] * h);
      else ctx.lineTo(p[0] * w, p[1] * h);
    });
    ctx.stroke();
  });

  // Draw targets as dots
  const drawTargets = (targets, color) => {
    targets.forEach(t => {
      ctx.beginPath();
      ctx.fillStyle = color + '60';
      ctx.arc(t.x * w, t.y * h, 2, 0, Math.PI * 2);
      ctx.fill();

      // Show name for impacted targets
      const impacted = impacts.find(imp => imp.name === t.name);
      if (impacted) {
        ctx.fillStyle = color + 'aa';
        ctx.font = `${Math.max(8, w * 0.012)}px 'Share Tech Mono', monospace`;
        ctx.fillText(t.name, t.x * w + 5, t.y * h - 5);
      }
    });
  };

  drawTargets([...usTargets, ...euroTargets], '#ff3333');
  drawTargets(sovietTargets, '#33ff33');

  // Draw launch bases
  const drawBases = (bases, color) => {
    bases.forEach(b => {
      ctx.beginPath();
      ctx.strokeStyle = color + '30';
      ctx.lineWidth = 0.5;
      const s = 3;
      ctx.moveTo(b.x * w - s, b.y * h - s);
      ctx.lineTo(b.x * w + s, b.y * h + s);
      ctx.moveTo(b.x * w + s, b.y * h - s);
      ctx.lineTo(b.x * w - s, b.y * h + s);
      ctx.stroke();
    });
  };

  if (currentDefcon <= 3) {
    drawBases(sovietBases, '#ff3333');
    drawBases(usBases, '#33ff33');
  }

  // Draw missiles
  missiles.forEach(m => m.draw(ctx, w, h));

  // Draw impacts
  impacts.forEach(imp => {
    const age = Date.now() - imp.time;
    if (age < 4000) {
      const r = Math.min(age / 100, 20);
      const alpha = Math.max(0, 1 - age / 4000);

      // Expanding ring
      ctx.beginPath();
      ctx.strokeStyle = imp.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
      ctx.lineWidth = 1;
      ctx.arc(imp.x * w, imp.y * h, r, 0, Math.PI * 2);
      ctx.stroke();

      // Flash
      if (age < 300) {
        ctx.beginPath();
        ctx.fillStyle = '#ffffff' + Math.floor((1 - age / 300) * 180).toString(16).padStart(2, '0');
        ctx.arc(imp.x * w, imp.y * h, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // Persistent glow
      ctx.beginPath();
      ctx.fillStyle = imp.color + '15';
      ctx.arc(imp.x * w, imp.y * h, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

// ============================================================
// DRAW THREAT ASSESSMENT (Bottom Left)
// ============================================================

function drawThreatPanel(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const cfg = defconConfig[currentDefcon];
  const pad = { top: 25, bottom: 15, left: 15, right: 15 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  // Grid
  ctx.strokeStyle = '#0a1a0a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 10; i++) {
    const x = pad.left + (plotW / 10) * i;
    const y = pad.top + (plotH / 10) * i;
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + plotW, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = cfg.color + '40';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.lineTo(pad.left + plotW, pad.top + plotH);
  ctx.stroke();

  // Regions / threat bars
  const regions = [
    { name: "CONUS", threat: 0 },
    { name: "EUR", threat: 0 },
    { name: "PAC", threat: 0 },
    { name: "USSR", threat: 0 },
    { name: "SLBM", threat: 0 },
    { name: "SAC", threat: 0 },
  ];

  // Calculate threat levels
  if (currentDefcon <= 3) {
    const elapsed = (Date.now() - warStartTime) / 1000;
    const maxThreat = currentDefcon === 1 ? 0.95 : currentDefcon === 2 ? 0.7 : 0.35;
    regions[0].threat = Math.min(maxThreat, elapsed * 0.01 * (6 - currentDefcon) + Math.sin(elapsed * 0.5) * 0.05);
    regions[1].threat = Math.min(maxThreat, elapsed * 0.008 * (6 - currentDefcon) + Math.sin(elapsed * 0.7) * 0.04);
    regions[2].threat = Math.min(maxThreat * 0.7, elapsed * 0.006 * (6 - currentDefcon) + Math.sin(elapsed * 0.3) * 0.03);
    regions[3].threat = Math.min(maxThreat, elapsed * 0.012 * (6 - currentDefcon) + Math.sin(elapsed * 0.6) * 0.06);
    regions[4].threat = Math.min(maxThreat * 0.8, elapsed * 0.009 * (6 - currentDefcon) + Math.cos(elapsed * 0.4) * 0.04);
    regions[5].threat = Math.min(maxThreat * 0.6, elapsed * 0.007 * (6 - currentDefcon) + Math.sin(elapsed * 0.8) * 0.03);
    regions.forEach(r => r.threat = Math.max(0, r.threat));
  }

  const barW = plotW / regions.length - 8;

  regions.forEach((r, i) => {
    const x = pad.left + (plotW / regions.length) * i + 4;
    const barH = r.threat * plotH;
    const y = pad.top + plotH - barH;

    // Bar color based on threat
    let barColor;
    if (r.threat > 0.7) barColor = '#ff2222';
    else if (r.threat > 0.4) barColor = '#ff8800';
    else if (r.threat > 0.1) barColor = '#cccc00';
    else barColor = '#33cc33';

    // Bar glow
    ctx.fillStyle = barColor + '20';
    ctx.fillRect(x, y, barW, barH);

    // Bar outline
    ctx.strokeStyle = barColor + 'aa';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, barW, barH);

    // Scanning line effect
    if (currentDefcon <= 3) {
      const scanY = pad.top + (Date.now() / 20 % plotH);
      if (scanY >= y && scanY <= y + barH) {
        ctx.fillStyle = barColor + '40';
        ctx.fillRect(x, scanY - 1, barW, 2);
      }
    }

    // Label
    ctx.fillStyle = cfg.color + 'cc';
    ctx.font = `${Math.max(8, w * 0.025)}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(r.name, x + barW / 2, pad.top + plotH + 12);

    // Percentage
    if (r.threat > 0) {
      ctx.fillStyle = barColor;
      ctx.fillText(Math.floor(r.threat * 100) + '%', x + barW / 2, y - 4);
    }
  });

  ctx.textAlign = 'left';

  // DEFCON indicator
  ctx.fillStyle = cfg.color;
  ctx.font = `${Math.max(10, w * 0.03)}px 'Share Tech Mono', monospace`;
  ctx.textAlign = 'right';
  ctx.fillText(`DEFCON ${currentDefcon}`, w - pad.right, pad.top + 15);

  if (currentDefcon <= 3) {
    ctx.fillStyle = cfg.color + '88';
    ctx.font = `${Math.max(8, w * 0.022)}px 'Share Tech Mono', monospace`;
    ctx.fillText(cfg.label, w - pad.right, pad.top + 30);
  }
  ctx.textAlign = 'left';
}

// ============================================================
// DRAW STRIKE ANALYSIS (Bottom Right)
// ============================================================

function drawStrikePanel(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const cfg = defconConfig[currentDefcon];
  const pad = { top: 25, bottom: 20, left: 40, right: 15 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  // Grid
  ctx.strokeStyle = '#0a1a0a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 10; i++) {
    const x = pad.left + (plotW / 10) * i;
    const y = pad.top + (plotH / 10) * i;
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + plotW, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = cfg.color + '40';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.lineTo(pad.left + plotW, pad.top + plotH);
  ctx.stroke();

  if (strikeData.length < 2) {
    // No data message
    ctx.fillStyle = cfg.color + '60';
    ctx.font = `${Math.max(9, w * 0.025)}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'center';
    if (currentDefcon >= 4) {
      ctx.fillText('NO STRIKE DATA', w / 2, h / 2);
      ctx.fillText('AWAITING SCENARIO', w / 2, h / 2 + 18);
    } else {
      ctx.fillText('COLLECTING DATA...', w / 2, h / 2);
    }
    ctx.textAlign = 'left';
    return;
  }

  const maxMissiles = Math.max(10, ...strikeData.map(d => d.total));
  const maxImpacts = Math.max(5, ...strikeData.map(d => d.impacts));
  const maxVal = Math.max(maxMissiles, maxImpacts);

  // Y-axis labels
  ctx.fillStyle = cfg.color + '80';
  ctx.font = `${Math.max(7, w * 0.02)}px 'Share Tech Mono', monospace`;
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = Math.floor(maxVal * (1 - i / 4));
    const y = pad.top + (plotH / 4) * i;
    ctx.fillText(val.toString(), pad.left - 4, y + 3);
  }
  ctx.textAlign = 'left';

  // Draw missile count line (green)
  ctx.beginPath();
  ctx.strokeStyle = '#33ff33cc';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#33ff33';
  ctx.shadowBlur = 3;
  strikeData.forEach((d, i) => {
    const x = pad.left + (i / (strikeData.length - 1)) * plotW;
    const y = pad.top + plotH - (d.total / maxVal) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Draw impact count line (red)
  ctx.beginPath();
  ctx.strokeStyle = '#ff3333cc';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = 3;
  strikeData.forEach((d, i) => {
    const x = pad.left + (i / (strikeData.length - 1)) * plotW;
    const y = pad.top + plotH - (d.impacts / maxVal) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Legend
  const legY = pad.top + 10;
  ctx.fillStyle = '#33ff33';
  ctx.fillRect(w - pad.right - 90, legY, 8, 2);
  ctx.fillStyle = '#33ff33cc';
  ctx.font = `${Math.max(7, w * 0.018)}px 'Share Tech Mono', monospace`;
  ctx.fillText('LAUNCHED', w - pad.right - 78, legY + 4);

  ctx.fillStyle = '#ff3333';
  ctx.fillRect(w - pad.right - 90, legY + 14, 8, 2);
  ctx.fillStyle = '#ff3333cc';
  ctx.fillText('IMPACTS', w - pad.right - 78, legY + 18);

  // X-axis label
  ctx.fillStyle = cfg.color + '60';
  ctx.textAlign = 'center';
  ctx.fillText('TIME ELAPSED', w / 2, h - 3);
  ctx.textAlign = 'left';
}

// ============================================================
// RESIZE HANDLER
// ============================================================

function resizeCanvases() {
  [canvasMain, canvasLeft, canvasRight].forEach(canvas => {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    canvas.getContext('2d').scale(window.devicePixelRatio, window.devicePixelRatio);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
  });
}

// ============================================================
// CLOCK
// ============================================================

function updateClock() {
  const now = new Date();
  const zulu = now.toISOString().substring(11, 19) + 'Z';
  document.getElementById('clock').textContent = `ZULU: ${zulu}`;
  document.getElementById('missile-count').textContent = `TRAJECTORIES: ${totalMissiles}`;
  document.getElementById('strike-count').textContent = `IMPACTS: ${totalImpacts}`;
}

// ============================================================
// MAIN LOOP
// ============================================================

function gameLoop() {
  // Launch missiles based on DEFCON
  launchMissile();

  // Update missiles
  missiles.forEach(m => m.update());

  // Prune old completed missiles (keep last N based on defcon)
  const maxKeep = currentDefcon === 1 ? 500 : currentDefcon === 2 ? 200 : 80;
  if (missiles.length > maxKeep) {
    missiles = missiles.filter(m => !m.done).concat(
      missiles.filter(m => m.done).slice(-maxKeep / 2)
    );
  }

  // Get canvas dimensions
  const mainRect = canvasMain.parentElement.getBoundingClientRect();
  const leftRect = canvasLeft.parentElement.getBoundingClientRect();
  const rightRect = canvasRight.parentElement.getBoundingClientRect();

  // Draw all three displays
  drawMap(ctxMain, mainRect.width, mainRect.height);
  drawThreatPanel(ctxLeft, leftRect.width, leftRect.height);
  drawStrikePanel(ctxRight, rightRect.width, rightRect.height);

  // Update HUD
  updateClock();
  renderEventLog();

  requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================

window.addEventListener('resize', resizeCanvases);
resizeCanvases();
setDefcon(5);
gameLoop();
</script>
