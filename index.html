<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOPR - Global Thermonuclear War</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000008;
    color: #77bbff;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    overflow: hidden;
    height: 100vh; width: 100vw;
  }
  #scanlines {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1000;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
      transparent 1px, transparent 3px);
  }
  #main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr auto 1fr;
    height: 100vh; gap: 5px; padding: 5px;
    background: #000008;
  }
  .panel {
    position: relative; overflow: hidden;
    background: #000010;
    border: 2px solid rgba(100,170,255,0.5);
    border-radius: 5px;
    box-shadow: 0 0 18px rgba(60,130,255,0.25),
                0 0 4px rgba(100,170,255,0.4),
                inset 0 0 40px rgba(0,5,20,0.6);
  }
  .panel canvas { width: 100%; height: 100%; display: block; }
  .panel-label {
    position: absolute; top: 5px; left: 8px;
    font-size: 0.5em; color: #88ccff; letter-spacing: 2px;
    z-index: 5; text-shadow: 0 0 8px rgba(100,180,255,0.7);
    line-height: 1.4;
  }
  .panel-label .sub { color: #5599cc; }
  #status-bar {
    grid-column: 1 / 4;
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 2px 10px;
    background: #000010;
    border-top: 1px solid rgba(100,170,255,0.35);
    border-bottom: 1px solid rgba(100,170,255,0.35);
    min-height: 26px; flex-wrap: wrap;
  }
  .sbl { color: #5599cc; font-size: 0.5em; letter-spacing: 1px; }
  .sbk { width: 16px; height: 8px; display: inline-block; vertical-align: middle; }
  .defcon-btn {
    padding: 1px 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55em; border: 1px solid #224;
    background: #060610; color: #446;
    cursor: pointer; letter-spacing: 1px;
  }
  .defcon-btn:hover { border-color: #558; color: #88aacc; }
  .defcon-btn.active {
    border-color: #5599ff; color: #5599ff;
    background: #0a0a20; text-shadow: 0 0 6px #5599ff;
  }
  .defcon-1.active {
    border-color: #ff4444; color: #ff4444;
    text-shadow: 0 0 6px #ff4444;
    animation: pd1 0.8s infinite;
  }
  .defcon-2.active { border-color: #ff8844; color: #ff8844; text-shadow: 0 0 6px #ff8844; }
  @keyframes pd1 {
    0%,100% { box-shadow: 0 0 4px rgba(255,68,68,0.3); }
    50% { box-shadow: 0 0 12px rgba(255,68,68,0.6); }
  }
  .cg { display: flex; align-items: center; gap: 3px; font-size: 0.55em; margin-left: 6px; }
  .cg .cl { color: #5599cc; font-size: 0.85em; }
  .cg .cv { color: #99ddff; letter-spacing: 1px; }
  #event-log {
    position: absolute; bottom: 4px; left: 8px;
    font-size: 0.42em; color: #88ccff; z-index: 5;
    text-shadow: 0 0 6px rgba(100,180,255,0.5);
    max-width: 55%;
  }
  #event-log div { margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="scanlines"></div>

</div>

// Projection calibrated to match SVG map (31 country centroids, cubic lat fit)
const GX=0.0030286746,GXB=0.4783456,GY3=-3.60798e-7,GY2=2.03949e-5,GY1=-0.0060070,GY0=0.6300874;
function geo(lon,lat){return[GX*lon+GXB,((GY3*lat+GY2)*lat+GY1)*lat+GY0];}
function geoXY(lon,lat){const c=geo(lon,lat);return{x:c[0],y:c[1]};}
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}
function glowFill(ctx,col,glowRadius,cx,cy){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,glowRadius);
  g.addColorStop(0,hexToRgba(col,0.9));
  g.addColorStop(0.4,hexToRgba(col,0.3));
  g.addColorStop(1,hexToRgba(col,0));
  ctx.fillStyle=g;
  ctx.fillRect(cx-glowRadius,cy-glowRadius,glowRadius*2,glowRadius*2);
}

// ── MISSILE ──
class Missile {
  constructor(from,to,color,speed){
    this.fx=from.x;this.fy=from.y;this.tx=to.x;this.ty=to.y;
    this.tgt=to.name||"";this.color=color;this.progress=0;
    this.speed=speed||(0.002+Math.random()*0.004);
    this.done=false;this.impacted=false;
    this.arc=0.08+Math.random()*0.12;
    this.side=color===RED?'sov':'us';
    this._r=parseInt(color.slice(1,3),16);
    this._g=parseInt(color.slice(3,5),16);
    this._b=parseInt(color.slice(5,7),16);
  }
  update(){
    if(this.done)return;
    this.progress+=this.speed;
    if(this.progress>=1){this.progress=1;this.done=true;
      if(!this.impacted){this.impacted=true;totalImpacts++;
        impacts.push({x:this.tx,y:this.ty,time:Date.now(),name:this.tgt,color:this.color,
          _r:this._r,_g:this._g,_b:this._b});
      }
    }
  }
  pos(t){
    return{x:this.fx+(this.tx-this.fx)*t,
           y:this.fy+(this.ty-this.fy)*t-Math.sin(t*Math.PI)*this.arc};
  }
}

// ── BATCHED MISSILE DRAWING ──
// Draws all missiles in one batch per color, drastically reducing draw calls at DEFCON 1
function drawMissilesBatched(ctx,w,h,vb,bright){
  const mc=missiles.length;
  if(mc===0)return;
  const step=mc>200?0.05:mc>100?0.035:bright?0.02:0.03;
  const dashLen=bright?4:3,gapLen=bright?6:5;
  const lw=bright?1.2:0.7;
  const ts=(px,py)=>{
    if(!vb)return[px*w,py*h];
    return[(px-vb.x)/vb.w*w,(py-vb.y)/vb.h*h];
  };
  const isVis=(m)=>{
    if(!vb)return true;
    const a=m.pos(0),b=m.pos(0.5),c=m.pos(m.progress);
    const inv=p=>p.x<vb.x-0.05||p.x>vb.x+vb.w+0.05||p.y<vb.y-0.05||p.y>vb.y+vb.h+0.05;
    return!(inv(a)&&inv(b)&&inv(c));
  };

  // Group by color
  const groups={};
  missiles.forEach(m=>{
    if(!isVis(m))return;
    const key=m.color;
    if(!groups[key])groups[key]={r:m._r,g:m._g,b:m._b,missiles:[m]};
    else groups[key].missiles.push(m);
  });

  ctx.setLineDash([dashLen,gapLen]);

  for(const key in groups){
    const grp=groups[key];
    const {r,g,b:bl}=grp;
    const ms=grp.missiles;

    // Build combined path for all missiles in this color group
    ctx.beginPath();
    for(let mi=0;mi<ms.length;mi++){
      const m=ms[mi];
      let first=true;
      for(let t=0;t<=m.progress;t+=step){
        const p=m.pos(t);const[sx,sy]=ts(p.x,p.y);
        if(first){ctx.moveTo(sx,sy);first=false;}else ctx.lineTo(sx,sy);
      }
      const fp=m.pos(m.progress);const[fsx,fsy]=ts(fp.x,fp.y);
      ctx.lineTo(fsx,fsy);
    }

    // 4-pass glow stroke on combined path
    ctx.strokeStyle=`rgba(${r},${g},${bl},${bright?0.08:0.04})`;
    ctx.lineWidth=lw+8;ctx.stroke();
    ctx.strokeStyle=`rgba(${r},${g},${bl},${bright?0.18:0.1})`;
    ctx.lineWidth=lw+4;ctx.stroke();
    ctx.strokeStyle=`rgba(${r},${g},${bl},${bright?0.45:0.25})`;
    ctx.lineWidth=lw+1.5;ctx.stroke();
    ctx.strokeStyle=`rgba(${r},${g},${bl},${bright?0.95:0.7})`;
    ctx.lineWidth=lw;ctx.stroke();

    // Leading dots with glow
    const dotSz=bright?2.5:1.5;
    const useGrad=mc<80;
    for(let mi=0;mi<ms.length;mi++){
      const m=ms[mi];
      if(m.done)continue;
      const fp=m.pos(m.progress);const[fsx,fsy]=ts(fp.x,fp.y);
      const sz=bright?10:7;
      const grad=ctx.createRadialGradient(fsx,fsy,0,fsx,fsy,sz);
      grad.addColorStop(0,'rgba(255,255,255,0.95)');
      grad.addColorStop(0.15,`rgba(${r},${g},${bl},0.8)`);
      grad.addColorStop(0.5,`rgba(${r},${g},${bl},0.25)`);
      grad.addColorStop(1,`rgba(${r},${g},${bl},0)`);
      ctx.fillStyle=grad;ctx.fillRect(fsx-sz,fsy-sz,sz*2,sz*2);
    }
  }
  ctx.setLineDash([]);
}

// ── IMPACTS ──
function drawImpacts(ctx,w,h,vb){
  const now=Date.now();
  // Purge old impacts
  if(impacts.length>150)impacts.splice(0,impacts.length-150);
  impacts.forEach(imp=>{
    let sx,sy;
    if(vb){sx=(imp.x-vb.x)/vb.w*w;sy=(imp.y-vb.y)/vb.h*h;if(sx<-20||sx>w+20||sy<-20||sy>h+20)return;}
    else{sx=imp.x*w;sy=imp.y*h;}
    const age=now-imp.time;
    const r=imp._r,g=imp._g,b=imp._b;
    if(age<3000){
      const rad=Math.min(age/80,20),a=Math.max(0,1-age/3000);
      // Outer glow
      const grd=ctx.createRadialGradient(sx,sy,rad*0.5,sx,sy,rad+10);
      grd.addColorStop(0,`rgba(${r},${g},${b},${a*0.3})`);
      grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.fillStyle=grd;ctx.fillRect(sx-rad-10,sy-rad-10,(rad+10)*2,(rad+10)*2);
      // Ring glow (wide dim)
      ctx.beginPath();ctx.strokeStyle=`rgba(${r},${g},${b},${a*0.25})`;
      ctx.lineWidth=6;ctx.arc(sx,sy,rad+2,0,Math.PI*2);ctx.stroke();
      // Ring core (bright)
      ctx.beginPath();ctx.strokeStyle=`rgba(${r},${g},${b},${a*0.95})`;
      ctx.lineWidth=1.8;ctx.arc(sx,sy,rad,0,Math.PI*2);ctx.stroke();
      if(age<500){
        const fa=1-age/500;
        // Bright flash with glow
        const fg=ctx.createRadialGradient(sx,sy,0,sx,sy,8*fa+3);
        fg.addColorStop(0,`rgba(255,255,255,${fa*0.95})`);
        fg.addColorStop(0.3,`rgba(${r},${g},${b},${fa*0.6})`);
        fg.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=fg;ctx.fillRect(sx-12,sy-12,24,24);
      }
    }else{
      // Persistent glow dot
      const pg=ctx.createRadialGradient(sx,sy,0,sx,sy,6);
      pg.addColorStop(0,`rgba(${r},${g},${b},0.3)`);
      pg.addColorStop(0.5,`rgba(${r},${g},${b},0.1)`);
      pg.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.fillStyle=pg;ctx.fillRect(sx-6,sy-6,12,12);
    }
  });
}

// ── DEFCON CONFIG ──
const DC={
  5:{rate:0,lbl:"FADE OUT"},4:{rate:0,lbl:"DOUBLE TAKE"},
  3:{rate:2000,lbl:"ROUND HOUSE"},2:{rate:600,lbl:"FAST PACE"},
  1:{rate:100,lbl:"COCKED PISTOL"},
};

function setDefcon(l){
  currentDefcon=l;
  document.querySelectorAll('.defcon-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.defcon-'+l).classList.add('active');
  if(l<=3){warStartTime=Date.now();addEvent(`DEFCON ${l} — ${DC[l].lbl}`);}
  if(l===3){addEvent("BMEWS TRACKING ACTIVE");addEvent("DSP SATELLITES MONITORING");}
  else if(l===2){addEvent("MULTIPLE LAUNCH DETECTIONS");addEvent("SAC FORCES SCRAMBLED");addEvent("LOOKING GLASS AIRBORNE");}
  else if(l===1){addEvent("MASSIVE ATTACK UNDERWAY");addEvent("RETALIATORY LAUNCH AUTH");addEvent("ALL ASSETS WEAPONS FREE");}
  if(l>=4){missiles=[];impacts=[];totalMissiles=0;totalImpacts=0;strikeData=[];eventMessages=[];
    if(l===5)addEvent("SYSTEM READY");if(l===4)addEvent("INCREASED READINESS");}
}

function addEvent(m){eventMessages.unshift({text:m,time:Date.now()});if(eventMessages.length>6)eventMessages.pop();}
function renderLog(){
  const el=document.getElementById('event-log');
  el.innerHTML=eventMessages.map(e=>{
    const a=Math.max(0.3,1-(Date.now()-e.time)/15000);
    return`<div style="opacity:${a}">${e.text}</div>`;
  }).join('');
}

function launchMissile(){
  if(DC[currentDefcon].rate===0)return;
  const now=Date.now();
  if(now-lastMissileTime<DC[currentDefcon].rate)return;
  lastMissileTime=now;
  const cnt=currentDefcon===1?Math.floor(3+Math.random()*6):currentDefcon===2?Math.floor(1+Math.random()*3):1;
  for(let i=0;i<cnt;i++){
    const side=Math.random()<0.5?'sov':'us';
    let from,to,color;
    if(side==='sov'){
      from=sovietBases[Math.floor(Math.random()*sovietBases.length)];
      const at=[...usTargets,...euroTargets];to=at[Math.floor(Math.random()*at.length)];color=RED;
    }else{
      from=usBases[Math.floor(Math.random()*usBases.length)];
      to=sovietTargets[Math.floor(Math.random()*sovietTargets.length)];color=BLUE_B;
    }
    missiles.push(new Missile(from,to,color,0.003+Math.random()*0.005));totalMissiles++;
    if(Math.random()<0.12){addEvent(`${side==='sov'?'INBOUND':'OUTBOUND'} — TGT: ${to.name}`);}
  }
  strikeData.push({time:now,total:totalMissiles,impacts:totalImpacts});
  if(strikeData.length>200)strikeData.shift();
}

// ── STATIC BACKGROUND DRAWING ──
function drawSquaresStatic(ctx,tgts,w,h,vb,color,sz){
  const s=sz||3;
  const baseCol=color.length>7?color.slice(0,7):color;
  const baseAlpha=color.length===9?parseInt(color.slice(7,9),16)/255:1;
  tgts.forEach(t=>{
    let sx,sy;
    if(vb){sx=(t.x-vb.x)/vb.w*w;sy=(t.y-vb.y)/vb.h*h;if(sx<-10||sx>w+10||sy<-10||sy>h+10)return;}
    else{sx=t.x*w;sy=t.y*h;}
    ctx.strokeStyle=hexToRgba(baseCol,0.12*baseAlpha);ctx.lineWidth=3;
    ctx.strokeRect(sx-s-1,sy-s-1,(s+1)*2,(s+1)*2);
    ctx.strokeStyle=hexToRgba(baseCol,0.8*baseAlpha);ctx.lineWidth=1.2;
    ctx.strokeRect(sx-s,sy-s,s*2,s*2);
  });
}

// Draw SVG map into a region of the canvas using crop rect
function drawMapRegion(ctx,w,h,cropKey){
  if(!mapsReady)return;
  const img=regionImages[cropKey];
  if(!img)return;
  // SVG has built-in glow (blurred wide stroke) + bright core
  ctx.drawImage(img,0,0,w,h);
}

// ── BUILD STATIC BACKGROUNDS ──
function buildBG(idx,w,h,drawFn){
  const oc=document.createElement('canvas');
  oc.width=w;oc.height=h;
  const octx=oc.getContext('2d');
  drawFn(octx,w,h);
  bgCanvases[idx]=oc;
}

function buildAllBGs(){
  if(!mapsReady)return;
  const dpr=window.devicePixelRatio;
  panelSizes.forEach((s,i)=>{
    const pw=s.width*dpr,ph=s.height*dpr;
    buildBG(i,pw,ph,(ctx,w,h)=>{
      ctx.scale(dpr,dpr);
      const rw=s.width,rh=s.height;
      switch(i){
        case 0: buildBG_Alaska(ctx,rw,rh); break;
        case 1: buildBG_CONUS(ctx,rw,rh); break;
        case 2: buildBG_Soviet(ctx,rw,rh); break;
        case 3: buildBG_SAC(ctx,rw,rh); break;
        case 4: buildBG_Atlantic(ctx,rw,rh); break;
        case 5: buildBG_Global(ctx,rw,rh); break;
      }
    });
  });
}

function buildBG_Alaska(ctx,w,h){
  drawMapRegion(ctx,w,h,'alaska');
  const cx=w*0.35,cy=h*0.55;
  for(let r=1;r<=4;r++){
    const rad=r*w*0.2;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);
    ctx.strokeStyle=hexToRgba(BLUE_D,0.1);ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle=hexToRgba(BLUE_D,0.4);ctx.lineWidth=0.7;ctx.stroke();
  }
}

function buildBG_CONUS(ctx,w,h){
  const vb=panelVB.conus;
  drawMapRegion(ctx,w,h,'conus');
  for(let lon=-120;lon<=-70;lon+=10){
    const sx=(geo(lon,0)[0]-vb.x)/vb.w*w;
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,h);
    ctx.strokeStyle=hexToRgba(BLUE_D,0.06);ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle=hexToRgba(BLUE_D,0.12);ctx.lineWidth=0.3;ctx.stroke();
  }
  for(let lat=25;lat<=50;lat+=5){
    const sy=(geo(0,lat)[1]-vb.y)/vb.h*h;
    ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(w,sy);
    ctx.strokeStyle=hexToRgba(BLUE_D,0.06);ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle=hexToRgba(BLUE_D,0.12);ctx.lineWidth=0.3;ctx.stroke();
  }
  drawSquaresStatic(ctx,usTargets,w,h,vb,CYAN+'70',3);
  usBases.forEach(b=>{
    const sx=(b.x-vb.x)/vb.w*w,sy=(b.y-vb.y)/vb.h*h;
    if(sx<-10||sx>w+10||sy<-10||sy>h+10)return;
    glowFill(ctx,BLUE,6,sx,sy);
    ctx.fillStyle=hexToRgba(BLUE,0.85);ctx.fillRect(sx-2.5,sy-2.5,5,5);
  });
  ctx.font=`${Math.max(7,w*0.016)}px 'Share Tech Mono',monospace`;
  usTargets.slice(0,10).forEach(t=>{
    const sx=(t.x-vb.x)/vb.w*w,sy=(t.y-vb.y)/vb.h*h;
    if(sx>5&&sx<w-40&&sy>18&&sy<h-5){
      ctx.fillStyle=hexToRgba(BLUE,0.25);ctx.fillText(t.name,sx+5,sy-4);
      ctx.fillStyle=hexToRgba(BLUE,0.25);ctx.fillText(t.name,sx+5,sy-2);
      ctx.fillStyle=hexToRgba(BLUE,0.7);ctx.fillText(t.name,sx+5,sy-3);
    }
  });
}

function buildBG_Soviet(ctx,w,h){
  const vb=panelVB.soviet;
  drawMapRegion(ctx,w,h,'soviet');
  drawSquaresStatic(ctx,sovietTargets,w,h,vb,RED+'60',3);
  sovietBases.forEach(b=>{
    const sx=(b.x-vb.x)/vb.w*w,sy=(b.y-vb.y)/vb.h*h;
    if(sx<-10||sx>w+10||sy<-10||sy>h+10)return;
    glowFill(ctx,RED,5,sx,sy);
    ctx.fillStyle=hexToRgba(RED,0.75);ctx.fillRect(sx-2,sy-2,4,4);

}

function buildBG_SAC(ctx,w,h){
  const vb=panelVB.sac;
  drawMapRegion(ctx,w,h,'sac');
  const n=geoXY(-104.9,38.7);
  const nx=(n.x-vb.x)/vb.w*w,ny=(n.y-vb.y)/vb.h*h;
  if(nx>0&&nx<w&&ny>0&&ny<h){
    glowFill(ctx,CYAN,12,nx,ny);
    ctx.fillStyle=CYAN;ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(i*2*Math.PI/5),ar=-Math.PI/2+((i+0.5)*2*Math.PI/5);
      ctx.lineTo(nx+Math.cos(a)*6,ny+Math.sin(a)*6);
      ctx.lineTo(nx+Math.cos(ar)*3,ny+Math.sin(ar)*3);
    }
    ctx.closePath();ctx.fill();
    ctx.font=`${Math.max(7,w*0.02)}px 'Share Tech Mono',monospace`;
    ctx.fillStyle=hexToRgba(CYAN,0.2);ctx.fillText('NORAD',nx+8,ny+2);
    ctx.fillStyle=hexToRgba(CYAN,0.2);ctx.fillText('NORAD',nx+8,ny+4);
    ctx.fillStyle=CYAN;ctx.fillText('NORAD',nx+8,ny+3);
  }
  ctx.font=`${Math.max(12,w*0.04)}px 'Share Tech Mono',monospace`;
  [{n:'25',lon:-105,lat:47},{n:'24',lon:-98,lat:47},{n:'27',lon:-102,lat:42},{n:'26',lon:-95,lat:43}].forEach(s=>{
    const sx=(geo(s.lon,0)[0]-vb.x)/vb.w*w,sy=(geo(0,s.lat)[1]-vb.y)/vb.h*h;
    if(sx>0&&sx<w&&sy>0&&sy<h){
      ctx.fillStyle=hexToRgba(BLUE,0.12);ctx.fillText(s.n,sx,sy-1);ctx.fillText(s.n,sx,sy+1);
      ctx.fillStyle=hexToRgba(BLUE,0.35);ctx.fillText(s.n,sx,sy);
    }
  });
  ctx.font=`${Math.max(6,w*0.014)}px 'Share Tech Mono',monospace`;
  sacBases.forEach(b=>{
    const sx=(b.x-vb.x)/vb.w*w,sy=(b.y-vb.y)/vb.h*h;
    if(sx<0||sx>w||sy<0||sy>h)return;
    glowFill(ctx,CYAN,8,sx,sy);
    ctx.fillStyle=hexToRgba(CYAN,0.85);ctx.fillRect(sx-3,sy-3,6,6);
    const lines=(b.lbl||b.name).split('\n');
    lines.forEach((l,i)=>{
      ctx.fillStyle=hexToRgba(BLUE_B,0.15);ctx.fillText(l,sx+6,sy-3+i*9);ctx.fillText(l,sx+6,sy-1+i*9);
      ctx.fillStyle=hexToRgba(BLUE_B,0.55);ctx.fillText(l,sx+6,sy-2+i*9);
    });
  });
}

function buildBG_Atlantic(ctx,w,h){
  const vb=panelVB.atlantic;
  drawMapRegion(ctx,w,h,'atlantic');
  ctx.setLineDash([4,4]);
  [[[-75,50],[-50,55]],[[-70,45],[-45,50]],[[-65,40],[-40,45]],[[-75,50],[-70,45]],[[-70,45],[-65,40]]].forEach(([f,t])=>{
    const x1=(geo(f[0],0)[0]-vb.x)/vb.w*w,y1=(geo(0,f[1])[1]-vb.y)/vb.h*h;
    const x2=(geo(t[0],0)[0]-vb.x)/vb.w*w,y2=(geo(0,t[1])[1]-vb.y)/vb.h*h;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=hexToRgba(BLUE,0.07);ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle=hexToRgba(BLUE,0.22);ctx.lineWidth=1;ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.font=`${Math.max(14,w*0.045)}px 'Share Tech Mono',monospace`;
  [{n:'21',lon:-60,lat:48},{n:'22',lon:-55,lat:53},{n:'20',lon:-65,lat:43}].forEach(s=>{
    const sx=(geo(s.lon,0)[0]-vb.x)/vb.w*w,sy=(geo(0,s.lat)[1]-vb.y)/vb.h*h;
    ctx.fillStyle=hexToRgba(BLUE,0.12);ctx.fillText(s.n,sx,sy-1);ctx.fillText(s.n,sx,sy+1);
    ctx.fillStyle=hexToRgba(BLUE,0.35);ctx.fillText(s.n,sx,sy);
  });
  ctx.font=`${Math.max(6,w*0.014)}px 'Share Tech Mono',monospace`;
  [{name:"LORING\nAIR FORCE BASE",...geoXY(-67.9,46.9)},{name:"OTIS AFB",...geoXY(-70.5,41.7)}].forEach(b=>{
    const sx=(b.x-vb.x)/vb.w*w,sy=(b.y-vb.y)/vb.h*h;
    if(sx<0||sx>w||sy<0||sy>h)return;
    glowFill(ctx,CYAN,10,sx,sy);
    ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);
    ctx.strokeStyle=hexToRgba(CYAN,0.1);ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle=hexToRgba(CYAN,0.7);ctx.lineWidth=1.5;ctx.stroke();
    const lines=b.name.split('\n');
    lines.forEach((l,i)=>{
      ctx.fillStyle=hexToRgba(BLUE_B,0.15);ctx.fillText(l,sx+9,sy-3+i*9);ctx.fillText(l,sx+9,sy-1+i*9);
      ctx.fillStyle=hexToRgba(BLUE_B,0.55);ctx.fillText(l,sx+9,sy-2+i*9);
    });

  drawSquaresStatic(ctx,usTargets.filter(t=>['BOSTON','NEW YORK','WASHINGTON DC'].includes(t.name)),w,h,vb,CYAN+'55',4);

function buildBG_Global(ctx,w,h){
  drawMapRegion(ctx,w,h,'global');
  drawSquaresStatic(ctx,usTargets,w,h,null,CYAN+'40',2);
  drawSquaresStatic(ctx,euroTargets,w,h,null,CYAN+'35',2);
  drawSquaresStatic(ctx,sovietTargets,w,h,null,RED+'45',2);
  usBases.forEach(b=>{
    glowFill(ctx,BLUE,4,b.x*w,b.y*h);
    ctx.fillStyle=hexToRgba(BLUE,0.6);ctx.fillRect(b.x*w-1.5,b.y*h-1.5,3,3);
  });
  sovietBases.forEach(b=>{
    glowFill(ctx,RED,4,b.x*w,b.y*h);
    ctx.fillStyle=hexToRgba(RED,0.55);ctx.fillRect(b.x*w-1.5,b.y*h-1.5,3,3);
  });
}

// ── PANEL DRAWS (dynamic) ──
function drawAlaska(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(bgCanvases[0])ctx.drawImage(bgCanvases[0],0,0,w,h);
  const sa=(Date.now()/3000)%(Math.PI*2);
  const cx=w*0.35,cy=h*0.55;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,Math.max(w,h),sa,sa+0.15);ctx.closePath();
  ctx.fillStyle='rgba(80,160,255,0.06)';ctx.fill();
  if(currentDefcon<=3){drawMissilesBatched(ctx,w,h,panelVB.alaska,true);drawImpacts(ctx,w,h,panelVB.alaska);}
}

function drawCONUS(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(bgCanvases[1])ctx.drawImage(bgCanvases[1],0,0,w,h);
  if(currentDefcon<=3){drawMissilesBatched(ctx,w,h,panelVB.conus,true);drawImpacts(ctx,w,h,panelVB.conus);}
}

function drawSoviet(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(bgCanvases[2])ctx.drawImage(bgCanvases[2],0,0,w,h);
  if(currentDefcon<=3){drawMissilesBatched(ctx,w,h,panelVB.soviet,true);drawImpacts(ctx,w,h,panelVB.soviet);}
}

function drawSAC(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(bgCanvases[3])ctx.drawImage(bgCanvases[3],0,0,w,h);
  const vb=panelVB.sac;
  if(currentDefcon<=2){
    const el=(Date.now()-warStartTime)/1000;
    sacBases.forEach(b=>{
      const sx=(b.x-vb.x)/vb.w*w,sy=(b.y-vb.y)/vb.h*h;
      if(sx<0||sx>w||sy<0||sy>h)return;
      for(let a=-1.5;a<-0.3;a+=0.4){
        const len=Math.min(1,el/8)*60+10;
        const ex=sx+Math.cos(a)*len,ey=sy+Math.sin(a)*len;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);
        ctx.strokeStyle=hexToRgba(CYAN,0.08);ctx.lineWidth=3;ctx.stroke();
        ctx.strokeStyle=hexToRgba(CYAN,0.3);ctx.lineWidth=0.8;ctx.stroke();
      }
    });
  }
  if(currentDefcon<=3){drawMissilesBatched(ctx,w,h,vb,false);drawImpacts(ctx,w,h,vb);}
}

function drawAtlantic(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(bgCanvases[4])ctx.drawImage(bgCanvases[4],0,0,w,h);
  if(currentDefcon<=3){drawMissilesBatched(ctx,w,h,panelVB.atlantic,false);drawImpacts(ctx,w,h,panelVB.atlantic);}
}

function drawGlobal(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(bgCanvases[5])ctx.drawImage(bgCanvases[5],0,0,w,h);
  if(currentDefcon<=3){drawMissilesBatched(ctx,w,h,null,false);drawImpacts(ctx,w,h,null);}
}

// ── RESIZE ──
function resize(){
  const dpr=window.devicePixelRatio;
  panelSizes=cvs.map(({c})=>{
    const r=c.parentElement.getBoundingClientRect();
    c.width=r.width*dpr;c.height=r.height*dpr;
    c.getContext('2d').scale(dpr,dpr);
    c.style.width=r.width+'px';c.style.height=r.height+'px';
    return{width:r.width,height:r.height};
  });
  buildAllBGs();
}

// ── STATUS ──
function updateStatus(){
  document.getElementById('ct4').textContent=String(totalMissiles).padStart(4,' ');
  document.getElementById('ct5').textContent=String(totalImpacts).padStart(4,' ');
  if(currentDefcon<=3){
    const el=(Date.now()-warStartTime)/1000;
    const base=[3252,3416,5417,7671],decay=currentDefcon===1?15:currentDefcon===2?5:1;
    ['ct0','ct1','ct2','ct3'].forEach((id,i)=>{
      document.getElementById(id).textContent=String(Math.max(0,base[i]-Math.floor(el*decay*(1+Math.random()*0.3)))).padStart(4,' ');
    });
  }
}

// ── TIC TAC TOE ──
let tttActive=false, tttBoard=Array(9).fill(0), tttTurn=1, tttWinner=0;
let tttMoveTime=0, tttMoveDelay=400, tttGameOverTime=0, tttGames=0;
let tttDraws=0, tttMoveHistory=[], tttWinLine=null;

function toggleTTT(){
  tttActive=!tttActive;
  const btn=document.getElementById('play-btn');
  const lbl=document.getElementById('lbl4');
  if(tttActive){
    btn.classList.add('active');btn.textContent='■ STOP';
    lbl.innerHTML='A STRANGE GAME<br><span class="sub">THE ONLY WINNING MOVE IS NOT TO PLAY</span>';
    tttReset();
  } else {
    btn.classList.remove('active');btn.textContent='▶ PLAY';
    lbl.innerHTML='NORTH ATLANTIC DEFENSE<br><span class="sub">ADIZ SECTORS</span>';
    buildBG(4,panelSizes[4].width*window.devicePixelRatio,panelSizes[4].height*window.devicePixelRatio,(ctx,w,h)=>{
      ctx.scale(window.devicePixelRatio,window.devicePixelRatio);buildBG_Atlantic(ctx,panelSizes[4].width,panelSizes[4].height);
    });
  }
}

function tttReset(){
  tttBoard=Array(9).fill(0);tttTurn=1;tttWinner=0;tttWinLine=null;
  tttMoveHistory=[];tttMoveTime=Date.now()+600;
  tttMoveDelay=Math.max(150,400-tttGames*8);
}

function tttCheck(){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const w of wins){
    if(tttBoard[w[0]]&&tttBoard[w[0]]===tttBoard[w[1]]&&tttBoard[w[1]]===tttBoard[w[2]]){
      tttWinLine=w;return tttBoard[w[0]];
    }
  }
  return tttBoard.includes(0)?0:3; // 3=draw
}

function tttAiMove(player){
  // Minimax — perfect play guarantees a draw
  const opp=player===1?2:1;
  function minimax(board,p){
    const r=tttCheckBoard(board);
    if(r===player)return 10;if(r===opp)return -10;if(r===3)return 0;
    let best=p===player?-Infinity:Infinity;
    for(let i=0;i<9;i++){
      if(board[i])continue;
      board[i]=p;
      const s=minimax(board,p===1?2:1);
      board[i]=0;
      best=p===player?Math.max(best,s):Math.min(best,s);
    }
    return best;
  }
  let bestScore=-Infinity,bestMoves=[];
  for(let i=0;i<9;i++){
    if(tttBoard[i])continue;
    tttBoard[i]=player;
    const s=minimax(tttBoard,opp);
    tttBoard[i]=0;
    if(s>bestScore){bestScore=s;bestMoves=[i];}
    else if(s===bestScore)bestMoves.push(i);
  }
  return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

function tttCheckBoard(board){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const w of wins){
    if(board[w[0]]&&board[w[0]]===board[w[1]]&&board[w[1]]===board[w[2]])return board[w[0]];
  }
  return board.includes(0)?0:3;
}

function tttUpdate(){
  const now=Date.now();
  if(tttWinner){
    if(now-tttGameOverTime>1200){tttGames++;tttReset();}
    return;
  }
  if(now<tttMoveTime)return;
  // Both players use minimax — perfect play always ends in a draw
  let move=tttAiMove(tttTurn);
  if(move===undefined)return;
  tttBoard[move]=tttTurn;
  tttMoveHistory.push({cell:move,player:tttTurn,time:now});
  tttTurn=tttTurn===1?2:1;
  tttMoveTime=now+tttMoveDelay;
  const result=tttCheck();
  if(result){
    tttWinner=result;tttGameOverTime=now;
    tttDraws++;
  }
}

function drawTTT(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#000010';ctx.fillRect(0,0,w,h);
  tttUpdate();

  const sz=Math.min(w,h)*0.6;
  const ox=(w-sz)/2, oy=(h-sz)*0.45;
  const cs=sz/3;

  // Draw grid with glow
  ctx.lineWidth=2;
  for(let i=1;i<3;i++){
    const x=ox+i*cs, y=oy+i*cs;
    ctx.strokeStyle=hexToRgba(BLUE_D,0.3);ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(x,oy);ctx.lineTo(x,oy+sz);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox+sz,y);ctx.stroke();
    ctx.strokeStyle=hexToRgba(BLUE,0.7);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x,oy);ctx.lineTo(x,oy+sz);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox+sz,y);ctx.stroke();
  }

  // Draw pieces
  for(let i=0;i<9;i++){
    if(!tttBoard[i])continue;
    const col=Math.floor(i%3),row=Math.floor(i/3);
    const cx=ox+col*cs+cs/2, cy=oy+row*cs+cs/2;
    const pr=cs*0.3;
    const moveEntry=tttMoveHistory.find(m=>m.cell===i);
    const age=moveEntry?Date.now()-moveEntry.time:9999;
    const scale=Math.min(1,age/150);
    const flash=Math.max(0,1-age/300);

    if(tttBoard[i]===1){ // X — cyan/blue
      const s=pr*scale;
      // Glow
      ctx.strokeStyle=hexToRgba(CYAN,0.15+flash*0.3);ctx.lineWidth=8;
      ctx.beginPath();ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s,cy+s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+s,cy-s);ctx.lineTo(cx-s,cy+s);ctx.stroke();
      // Core
      ctx.strokeStyle=hexToRgba(CYAN,0.85+flash*0.15);ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s,cy+s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+s,cy-s);ctx.lineTo(cx-s,cy+s);ctx.stroke();
      if(flash>0){
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,pr*1.5);
        g.addColorStop(0,hexToRgba(CYAN,flash*0.3));g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(cx-pr*1.5,cy-pr*1.5,pr*3,pr*3);
      }
    } else { // O — red
      const r=pr*scale;
      // Glow
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=hexToRgba(RED,0.15+flash*0.3);ctx.lineWidth=8;ctx.stroke();
      // Core
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=hexToRgba(RED,0.85+flash*0.15);ctx.lineWidth=2.5;ctx.stroke();
      if(flash>0){
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,pr*1.5);
        g.addColorStop(0,hexToRgba(RED,flash*0.3));g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(cx-pr*1.5,cy-pr*1.5,pr*3,pr*3);
      }
    }
  }

  // Scoreboard
  ctx.font=`${Math.max(9,w*0.028)}px 'Share Tech Mono',monospace`;
  const sy=oy+sz+Math.max(18,h*0.06);
  ctx.fillStyle=hexToRgba(BLUE_D,0.15);ctx.fillText(`GAME ${tttGames+1}`,ox,sy);
  ctx.fillStyle=hexToRgba(BLUE,0.6);ctx.fillText(`GAME ${tttGames+1}`,ox,sy);

  const sc=`WINNER: NONE  DRAWS: ${tttDraws}`;
  ctx.fillStyle=hexToRgba(BLUE_D,0.15);ctx.fillText(sc,ox+sz-ctx.measureText(sc).width,sy);
  ctx.fillStyle=hexToRgba(BLUE,0.6);ctx.fillText(sc,ox+sz-ctx.measureText(sc).width,sy);

  // Winner text
  if(tttWinner){
    const pulse=0.7+0.3*Math.sin(Date.now()/150);
    const txt='DRAW';
    ctx.font=`${Math.max(14,w*0.06)}px 'Share Tech Mono',monospace`;
    const tw=ctx.measureText(txt).width;
    const tx=(w-tw)/2, ty=oy+sz+Math.max(40,h*0.14);
    const col=BLUE;
    ctx.fillStyle=hexToRgba(col,0.15*pulse);ctx.fillText(txt,tx,ty-1);ctx.fillText(txt,tx,ty+1);
    ctx.fillStyle=hexToRgba(col,0.9*pulse);ctx.fillText(txt,tx,ty);
  }
}

// ── MAIN LOOP ──
function loop(){
  launchMissile();
  missiles.forEach(m=>m.update());
  // Aggressive culling — keep fewer missiles at high DEFCON
  const mk=currentDefcon===1?300:currentDefcon===2?200:100;
  if(missiles.length>mk){
    const active=missiles.filter(m=>!m.done);
    const done=missiles.filter(m=>m.done);
    missiles=active.concat(done.slice(-Math.floor(mk*0.3)));
  }
  drawAlaska(cvs[0].x,panelSizes[0].width,panelSizes[0].height);
  drawCONUS(cvs[1].x,panelSizes[1].width,panelSizes[1].height);
  drawSoviet(cvs[2].x,panelSizes[2].width,panelSizes[2].height);
  drawSAC(cvs[3].x,panelSizes[3].width,panelSizes[3].height);
  if(tttActive) drawTTT(cvs[4].x,panelSizes[4].width,panelSizes[4].height);
  else drawAtlantic(cvs[4].x,panelSizes[4].width,panelSizes[4].height);
  drawGlobal(cvs[5].x,panelSizes[5].width,panelSizes[5].height);
  updateStatus();renderLog();
  requestAnimationFrame(loop);
}

window.addEventListener('resize',resize);
resize();loadMaps();setDefcon(5);loop();
</script>
